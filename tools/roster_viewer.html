<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quetopia — Model Studies</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a0910;color:#eee6ff;font:15px system-ui}header{padding:20px 24px;border-bottom:1px solid #382647;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}header p{margin:4px 0;color:#b6a8c6}main{display:grid;grid-template-columns:minmax(0,1fr) 290px;max-width:1500px;margin:auto}#stage{height:75vh;min-height:450px;position:relative;background:radial-gradient(ellipse at 50% 55%,#30213e,#090b14 70%)}canvas{width:100%;height:100%;display:block;touch-action:none}#caption{position:absolute;bottom:20px;left:24px;pointer-events:none}h2{margin:0 0 5px;font-size:23px}#status{color:#bfb1ce}aside{padding:16px;height:80vh;overflow:auto}.choice{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:#171220;border:1px solid #30253e;border-radius:8px;color:#eee;padding:8px;margin-bottom:8px;cursor:pointer}.choice[aria-pressed=true]{border-color:#d6a652;background:#30203e}.choice img{height:68px;width:55px;object-fit:contain;background:#25232a;border-radius:4px}.choice small{display:block;color:#b5a5c8;margin-top:3px}button,a{color:#efe2ff}header button,.links a{background:#281b36;border:1px solid #735185;border-radius:6px;padding:9px 13px;text-decoration:none;cursor:pointer}.links{display:flex;gap:9px;padding:15px 24px;flex-wrap:wrap}#reference{color:#d0bbeb;background:transparent}#fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}@media(max-width:750px){main{display:block}aside{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}#stage{height:65vh;min-height:360px}.choice{margin:0}header{padding:15px}h1{font-size:20px}}</style>
<script type="importmap">{"imports":{"three":"/grove/vendor/three/three.module.js"}}</script></head><body>
<header><div><h1>Quetopia · Model Studies</h1><p>Six characters · five new companions · Suneye saved separately</p></div><button id="rotate">Pause rotation</button><button id="reset">Reset view</button></header>
<main><section><div id="stage"><canvas aria-label="Interactive 3D model. Drag to rotate and scroll to zoom."></canvas><img id="fallback" alt="Rendered model preview"><div id="caption"><h2 id="name"></h2><div id="status">Loading…</div></div></div><div class="links"><a id="blend" download>Blender file</a><a id="glb" download>3D export</a><a id="render" target="_blank">Rendered view</a><a id="reference" target="_blank" rel="noopener">TikTok reference ↗</a></div></section><aside id="list" aria-label="Choose a model"></aside></main>
<script type="module">
const models=[['diamond-girl','Diamond Girl','Character','7673959393678920991'],['crescent-weaver','Crescent Weaver','Character','7678226230482685214'],['ember-sovereign','Ember Sovereign','Character','7683522615893363998'],['sally','Sally','Character','7683317432655596830'],['cyberdine','Cyberdine','Character','7681890768092499231'],['abyssal-cantor','Abyssal Cantor','Character adaptation','7682561983111023902'],['orrery-moth','Orrery Moth','Companion adaptation','7678226230482685214'],['cinderling','Cinderling','Companion adaptation','7683522615893363998'],['spark-imp','Spark Imp','Companion adaptation','7683317432655596830'],['lens-wisp','Lens Wisp','Companion adaptation','7681890768092499231'],['reef-lobster','Reef Lobster','Companion','7682561983111023902']];
const el=id=>document.getElementById(id),canvas=document.querySelector('canvas');let api=null,auto=true,token=0;
for(const [slug,name,type] of models){const b=document.createElement('button');b.className='choice';b.dataset.slug=slug;b.setAttribute('aria-pressed','false');b.innerHTML=`<img src="${slug}/${slug}.png" alt=""><span>${name}<small>${type}</small></span>`;b.onclick=()=>choose(slug);el('list').append(b)}
async function choose(slug){const m=models.find(m=>m[0]===slug)||models[0];slug=m[0];const current=++token;el('name').textContent=m[1];el('status').textContent='Loading 3D model…';el('fallback').style.display='none';el('fallback').src=`${slug}/${slug}.png`;for(const [id,ext] of [['blend','blend'],['glb','glb'],['render','png']])el(id).href=`${slug}/${slug}.${ext}`;el('reference').href='https://www.tiktok.com/@quetopia3/video/'+m[3];document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.slug===slug)));history.replaceState(null,'','#'+slug);
try{if(!api)api=await setup();await api.load(`${slug}/${slug}.glb`,()=>current===token);if(current===token)el('status').textContent='Drag to turn · Scroll to zoom · Static model study'}catch(e){if(current!==token)return;el('fallback').style.display='block';el('status').textContent='Rendered preview · 3D view unavailable';console.error(e)}}
async function setup(){const THREE=await import('three');const {GLTFLoader}=await import('/grove/vendor/three/GLTFLoader.js');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xe9ddff,0x201529,2));for(const [color,intensity,pos] of [[0xffdebb,3,[-3,5,4]],[0x55cfff,3,[3,3,-4]]]){const l=new THREE.DirectionalLight(color,intensity);l.position.set(...pos);scene.add(l)}const camera=new THREE.PerspectiveCamera(35,1,.01,1000),loader=new GLTFLoader();let root=null,target=new THREE.Vector3(),theta=.12,phi=1.35,radius=4,base=4,drag=null,last=0;
function reset(){theta=.12;phi=1.35;radius=base}el('reset').onclick=reset;
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;theta-=(e.clientX-drag[0])*.007;phi=Math.max(.15,Math.min(3,phi+(e.clientY-drag[1])*.007));drag=[e.clientX,e.clientY]};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(base*.35,Math.min(base*3,radius*Math.exp(e.deltaY*.001)))},{passive:false});new ResizeObserver(()=>{const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}).observe(el('stage'));
renderer.setAnimationLoop(t=>{const dt=Math.min(.05,(t-last)/1000);last=t;if(auto&&!drag)theta+=dt*.20;camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);renderer.render(scene,camera)});
function dispose(model){model.traverse(o=>{if(o.geometry)o.geometry.dispose();const ms=Array.isArray(o.material)?o.material:[o.material];ms.filter(Boolean).forEach(m=>m.dispose())})}
return{async load(url,isCurrent){const data=await loader.loadAsync(url);if(!isCurrent()){dispose(data.scene);return}if(root){scene.remove(root);dispose(root)}root=data.scene;scene.add(root);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3());box.getCenter(target);base=Math.max(size.y,size.x/Math.max(.5,camera.aspect))*1.8;reset()}}}
el('rotate').onclick=()=>{auto=!auto;el('rotate').textContent=auto?'Pause rotation':'Resume rotation'};choose(location.hash.slice(1));
</script></body></html>
