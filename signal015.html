.50+i*.16,56),new THREE.MeshBasicMaterial({color:i===1?0x6beaff:0xb45cff,transparent:true,opacity:.92-i*.16,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));r.rotation.x=-Math.PI/2;r.position.copy(pos);r.position.y=.09+i*.025;scene.add(r);fx.push({m:r,t:-i*.06,type:'anchorBurst'})}let beam=new THREE.Mesh(new THREE.CylinderGeometry(.08,.32,8,18,1,true),new THREE.MeshBasicMaterial({color:0x72eaff,transparent:true,opacity:.62,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));beam.position.copy(pos);beam.position.y=4;scene.add(beam);fx.push({m:beam,t:0,type:'anchorBeam'});flash(pos,0x68eaff,38)}\nfunction fxLife(f){if(f.type==='field')return 5;if(f.type==='anchorBurst')return 1.5;if(f.type==='anchorBeam')return 1.25;if(f.type==='moveMark')return .55;if(f.type==='novaDisc')return .75;return .8}`;\nh=h.replace('function bind(){',moveFx+'function bind(){');\nh=h.replace(\n  \"renderer.domElement.addEventListener('mousemove',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;cross.style.left=e.clientX+'px';cross.style.top=e.clientY+'px';updateAim()});renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0)signalShot();if(e.button===2)prism()});renderer.domElement.oncontextmenu=e=>e.preventDefault()\",\n  \"renderer.domElement.addEventListener('mousemove',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;cross.style.left=e.clientX+'px';cross.style.top=e.clientY+'px';updateAim();if(lmbHeld){moveTarget.copy(aim);mouseMoving=true}});renderer.domElement.addEventListener('mousedown',e=>{updateAim();if(e.button===0){lmbHeld=true;moveTarget.copy(aim);mouseMoving=true;moveClickFx(aim)}if(e.button===2){rmbHeld=true;signalShot()}});addEventListener('mouseup',e=>{if(e.button===0)lmbHeld=false;if(e.button===2)rmbHeld=false});renderer.domElement.addEventListener('mouseleave',()=>{lmbHeld=false;rmbHeld=false});renderer.domElement.oncontextmenu=e=>e.preventDefault()\"\n);\nh=h.repla stanceTo(player.position)<5.3)hitEnemy(e,95);flash(player.position,0xb449ff,32)}`;\nh=h.replace(/function nova\\(\\)\\{[\\s\\S]*?\\}(?=function fracture)/,novaFn);\nconst fractureFn=`function fracture(){if(ec>0||manav<34)return;ec=MAX.ec;manav-=34;let disc=new THREE.Mesh(new THREE.CircleGeometry(3.7,64),new THREE.MeshBasicMaterial({color:0x4239ff,transparent:true,opacity:.24,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));disc.rotation.x=-Math.PI/2;disc.position.copy(aim);disc.position.y=.075;let edge=new THREE.Mesh(new THREE.RingGeometry(3.18,3.66,64),new THREE.MeshBasicMaterial({color:0x6cecff,transparent:true,opacity:.72,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));disc.add(edge);let inner=new THREE.Mesh(new THREE.RingGeometry(1.72,1.82,56),new THREE.MeshBasicMaterial({color:0xd65cff,transparent:true,opacity:.62,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));disc.add(inner);scene.add(disc);fx.push({m:disc,t:0,type:'field',center:aim.clone(),tick:0});flash(aim,0x6258ff,26)}`;\nh=h.replace(/function fracture\\(\\)\\{[\\s\\S]*?\\}(?=function dash)/,fractureFn);\nh=h.replace(\n  \"if(f.type==='trail')f.m.material.opacity=Math.max(0,1-f.t*2.2);if(f.type==='field'){\",\n  \"if(f.type==='trail')f.m.material.opacity=Math.max(0,1-f.t*2.2);if(f.type==='moveMark'){let k=1+f.t*3.4;f.m.scale.set(k,k,k);f.m.material.opacity=Math.max(0,.8-f.t*1.5)}if(f.type==='anchorBurst'&&f.t>=0){let k=1+f.t*5.8;f.m.scale.set(k,k,k);f.m.material.opacity=Math.max(0,.9-f.t*.65)}if(f.type==='anchorBeam'){f.m.material.opacity=Math.max(0,.62-f.t*.48);f.m.scale.x=f.m.scale.z=1+f.t*.22}if(f.type==='novaDisc'){f.m.material.opacity=Math.max(0,.16-f.t*.2);f.m.scale.setScalar(1+f.t*.35)}if(f.type==='field'){f.m.rotation.z+=dt*.18;\"\n);\nh=h.replace(\n  \"for(let f of fx)if(f.t> (f.type==='field'?5:.8)){if(f.m)scene.remove(f.m);if(f.light)scene.remove(f.light)}fx=fx.filter(f=>f.t< (f.type==='field'?5:.8));\",\n  \"for(let  const marker=" document.open();document.write(h);document.close();";
