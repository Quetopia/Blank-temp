name: Single YouTube Audio

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/single-youtube-audio.yml

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp
      - name: Extract MP3
        run: |
          yt-dlp -x --audio-format mp3 --audio-quality 0 --embed-metadata \
            -o 'output.%(ext)s' \
            'https://youtu.be/oo-XzqolMXM'
          file output.mp3
          ls -lh output.mp3
      - name: Upload MP3
        uses: actions/upload-artifact@v4
        with:
          name: oo-XzqolMXM-MP3
          path: output.mp3
          if-no-files-found: error
          retention-days: 7
