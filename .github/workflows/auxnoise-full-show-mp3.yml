name: AUXNOISE Full Show MP3
on:
  push:
    paths:
      - '.github/workflows/auxnoise-full-show-mp3.yml'
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert AUXNOISE full show with multiple backends
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, re, time, json, os, sys
          VIDEO='rRDKrEEfN0k'
          URL=f'https://www.youtube.com/watch?v={VIDEO}'
          OUT='AUXNOISE-Full-Show.mp3'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36'

          def save_if_audio(resp, label):
              ct=(resp.headers.get('content-type') or '').lower()
              data=resp.content
              print(label,'download',resp.status_code,ct,'bytes',len(data),'final',resp.url)
              if resp.status_code >= 400: return False
              if len(data) < 100000: return False
              if 'text/html' in ct or 'application/json' in ct or data.lstrip().startswith(b'<'): return False
              open(OUT,'wb').write(data)
              print('SUCCESS via',label)
              return True

          def try_cnv():
              label='cnv.cx'
              try:
                  h={'origin':'https://frame.y2meta-uk.com','referer':'https://frame.y2meta-uk.com/','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Safari/537.36'}
                  r=requests.get('https://cnv.cx/v2/sanity/key',headers=h,timeout=30)
                  print(label,'key',r.status_code,r.text[:300]); r.raise_for_status()
                  key=r.json().get('key')
                  if not key: return False
                  hc=h.copy(); hc['key']=key; hc['content-type']='application/x-www-form-urlencoded'
                  payload={'link':f'https://youtu.be/{VIDEO}','format':'mp3','audioBitrate':'320','videoQuality':'720','filenameStyle':'pretty','vCodec':'h264'}
                  r=requests.post('https://cnv.cx/v2/converter',headers=hc,data=payload,timeout=180)
                  print(label,'convert',r.status_code,r.text[:500]); r.raise_for_status()
                  dl=r.json().get('url')
                  if not dl: return False
                  rr=requests.get(dl,headers={'User-Agent':UA},allow_redirects=True,timeout=600)
                  return save_if_audio(rr,label)
              except Exception as e:
                  print(label,'failed',repr(e)); return False

          def try_media():
              label='convert1s'
              try:
                  h={'User-Agent':UA,'Accept':'application/json','Accept-Language':'en-US,en;q=0.9','Origin':'https://media.ytmp3.gg','Referer':'https://media.ytmp3.gg/','Content-Type':'application/json'}
                  payload={'url':URL,'os':'windows','output':{'type':'audio','format':'mp3'},'audio':{'bitrate':'320k'}}
                  r=requests.post('https://hub.convert1s.com/api/download',headers=h,json=payload,timeout=180)
                  print(label,'start',r.status_code,r.text[:700]); r.raise_for_status()
                  status=r.json().get('statusUrl')
                  if not status: return False
                  base={k:v for k,v in h.items() if k!='Content-Type'}
                  dl=None
                  for i in range(300):
                      rr=requests.get(status,headers=base,timeout=30); rr.raise_for_status(); d=rr.json()
                      if i%20==0: print(label,'poll',i,d)
                      if d.get('status')=='completed' and d.get('downloadUrl'):
                          dl=d['downloadUrl']; break
                      if d.get('status') in ('failed','error','blocked'): return False
                      time.sleep(1)
                  if not dl: return False
                  dh={'User-Agent':UA,'Accept':'*/*','Accept-Language':'en-US,en;q=0.9','Referer':'https://media.ytmp3.gg/'}
                  rr=requests.get(dl,headers=dh,allow_redirects=True,timeout=600)
                  return save_if_audio(rr,label)
              except Exception as e:
                  print(label,'failed',repr(e)); return False

          def try_cnvmp3():
              label='cnvmp3'
              try:
                  h={'User-Agent':UA,'Accept':'application/json','Content-Type':'application/json','Origin':'https://cnvmp3.com','Referer':'https://cnvmp3.com/'}
                  urls={'check':'https://cnvmp3.com/check_database.php','meta':'https://cnvmp3.com/get_video_data.php','convert':'https://cnvmp3.com/download_video_ucep.php'}
                  r=requests.post(urls['check'],headers=h,json={'youtube_id':VIDEO,'quality':0,'formatValue':1},timeout=60)
                  print(label,'check',r.status_code,r.text[:700]); r.raise_for_status()
                  d=r.json(); data=d.get('data') or {}; dl=data.get('server_path'); title=data.get('title') or 'AUXNOISE Full Show'
                  if dl:
                      rr=requests.get(dl,headers={'Referer':'https://cnvmp3.com/','User-Agent':UA},allow_redirects=True,timeout=600)
                      if save_if_audio(rr,label+' cache'): return True
                  r=requests.post(urls['meta'],headers=h,json={'url':URL,'token':'1234'},timeout=90)
                  print(label,'meta',r.status_code,r.text[:700]); r.raise_for_status()
                  md=r.json(); title=md.get('title') or title
                  if md.get('success') is False: return False
                  r=requests.post(urls['convert'],headers=h,json={'url':URL,'quality':0,'title':title,'formatValue':1},timeout=600)
                  print(label,'convert',r.status_code,r.text[:1000]); r.raise_for_status()
                  d=r.json(); dl=d.get('download_link')
                  if not d.get('success') or not dl: return False
                  rr=requests.get(dl,headers={'Referer':'https://cnvmp3.com/','User-Agent':UA},allow_redirects=True,timeout=600)
                  return save_if_audio(rr,label)
              except Exception as e:
                  print(label,'failed',repr(e)); return False

          def try_4k():
              label='4kdownload'
              try:
                  h={'Origin':'https://4kdownload.to','Referer':'https://4kdownload.to/','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'}
                  r=requests.get('https://4kdownload.to/ensa/youtube-to-mp3',headers=h,timeout=45)
                  print(label,'page',r.status_code,'bytes',len(r.content)); r.raise_for_status()
                  m=re.search(r'''apikey\s*:\s*['\"]([^'\"]+)''',r.text,re.I) or re.search(r'''params\.apikey\s*=.*?\|\|\s*['\"]([^'\"]+)''',r.text,re.I|re.S)
                  if not m:
                      print(label,'no apikey'); return False
                  key=m.group(1); print(label,'apikey found',key[:6]+'...')
                  r=requests.get('https://p.savenow.to/api/v2/download',headers=h,params={'format':'mp3','url':URL,'apikey':key},timeout=90)
                  print(label,'start',r.status_code,r.text[:1000]); r.raise_for_status()
                  d=r.json(); progress=d.get('progress_url'); dl=d.get('download_url') or d.get('url')
                  deadline=time.time()+600
                  while not dl and progress and time.time()<deadline:
                      time.sleep(2); rr=requests.get(progress,headers=h,timeout=30); rr.raise_for_status(); d=rr.json()
                      if d.get('success') is False or d.get('error'): return False
                      dl=d.get('download_url') or d.get('url')
                  if not dl: return False
                  rr=requests.get(dl,headers={'User-Agent':UA},allow_redirects=True,timeout=600)
                  return save_if_audio(rr,label)
              except Exception as e:
                  print(label,'failed',repr(e)); return False

          for fn in (try_cnv, try_media, try_cnvmp3, try_4k):
              if fn(): sys.exit(0)
          raise SystemExit('All converter backends failed')
          PY
          file AUXNOISE-Full-Show.mp3
          ls -lh AUXNOISE-Full-Show.mp3
      - name: Upload full show MP3
        uses: actions/upload-artifact@v4
        with:
          name: AUXNOISE-Full-Show-MP3
          path: AUXNOISE-Full-Show.mp3
          if-no-files-found: error
