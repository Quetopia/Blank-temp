name: Quetopia YouTube Audio Export

on:
  push:
    branches:
      - auxnoise-audio-export
    paths:
      - .github/workflows/quetopia-audio-export.yml
  workflow_dispatch:

jobs:
  export-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip
          python -m pip install --upgrade pip yt-dlp

      - name: Download Quetopia videos and extract MP3 audio
        shell: bash
        run: |
          mkdir -p audio
          yt-dlp \
            --yes-playlist \
            --ignore-errors \
            --no-overwrites \
            --download-archive downloaded.txt \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --embed-metadata \
            --restrict-filenames \
            --output 'audio/%(upload_date>%Y-%m-%d)s_%(title).180B_[%(id)s].%(ext)s' \
            'https://www.youtube.com/@Quetopia/videos'

          echo "Downloaded audio files:"
          find audio -maxdepth 1 -type f -printf '%f\n' | sort
          echo "Total files: $(find audio -maxdepth 1 -type f | wc -l)"

      - name: Package audio
        if: always()
        run: |
          zip -r quetopia-youtube-audio-mp3.zip audio downloaded.txt || true

      - name: Upload converted audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quetopia-youtube-audio-mp3
          path: |
            quetopia-youtube-audio-mp3.zip
            audio/
            downloaded.txt
          if-no-files-found: warn
          retention-days: 7
