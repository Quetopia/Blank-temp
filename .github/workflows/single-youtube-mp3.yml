name: Single YouTube MP3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/single-youtube-mp3.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GET-based converter
        shell: bash
        run: |
          set -euo pipefail
          URL='https://yt-api.org/button/mp3/cmIfSfaHGlk'
          curl --max-time 30 -sS -L "$URL" -o page.html
          echo '--- file ---'
          file page.html
          wc -c page.html
          echo '--- urls ---'
          python - <<'PY'
          import re
          s=open('page.html',errors='ignore').read()
          for u in re.findall(r'https?://[^\"\'<>\\s]+', s): print(u)
          PY
          echo '--- api/fetch/download hints ---'
          grep -Eio '.{0,160}(fetch\(|axios|/api/|download|convert|mp3|cmIfSfaHGlk).{0,260}' page.html | head -160 || true
