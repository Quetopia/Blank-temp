name: Single YouTube MP3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/single-youtube-mp3.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect converter JavaScript
        shell: bash
        run: |
          set -euo pipefail
          URL='https://yt-api.org/button/mp3/cmIfSfaHGlk'
          curl --max-time 30 -sS -L "$URL" -o page.html
          echo '--- PAGE START ---'
          cat page.html
          echo
          echo '--- PAGE END ---'
          python - <<'PY'
          import re, subprocess
          s=open('page.html',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)', s, re.I)
          print('SCRIPT_SRCS',srcs)
          for src in srcs:
              if src.startswith('/'):
                  src='https://yt-api.org'+src
              if src.startswith('http'):
                  print('\n--- SCRIPT',src,'---')
                  subprocess.run(['curl','--max-time','30','-sS','-L',src])
          PY
