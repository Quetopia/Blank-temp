name: Single YouTube MP3

on:
  push:
    branches:
      - auxnoise-audio-export
    paths:
      - .github/workflows/single-youtube-mp3.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect EzRip frontend
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L 'https://ezrip.org/' -o page.html
          echo '--- script tags ---'
          grep -Eo '<script[^>]+src=["'"'][^"'"']+["'"']' page.html || true
          echo '--- api/fetch/form hints ---'
          grep -Eio '.{0,120}(fetch\(|axios|/api/|convert|youtube_url|quality).{0,220}' page.html | head -120 || true
          echo '--- forms ---'
          grep -Eio '<form[^>]*>|<input[^>]*>|<button[^>]*>' page.html | head -120 || true
