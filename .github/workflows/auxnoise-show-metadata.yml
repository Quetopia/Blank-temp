name: AUXNOISE Show Metadata
on:
  push:
    paths:
      - '.github/workflows/auxnoise-show-metadata.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public video metadata
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,json,html
          vid='rRDKrEEfN0k'
          ua={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/149 Safari/537.36'}
          for u in [f'https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v={vid}&format=json',f'https://noembed.com/embed?url=https://www.youtube.com/watch?v={vid}']:
              try:
                  r=requests.get(u,headers=ua,timeout=30)
                  print('\nENDPOINT',u,'STATUS',r.status_code,'\n',r.text[:5000])
              except Exception as e: print('endpoint failed',e)
          u=f'https://www.youtube.com/watch?v={vid}'
          r=requests.get(u,headers=ua,timeout=30)
          print('\nYOUTUBE STATUS',r.status_code,'LEN',len(r.text))
          open('youtube-page.html','w',encoding='utf-8').write(r.text)
          for pat in [r'"title":"((?:\\.|[^"\\])*)"',r'"shortDescription":"((?:\\.|[^"\\])*)"',r'"lengthSeconds":"(\d+)"']:
              m=re.search(pat,r.text)
              print('MATCH',pat, m.group(1)[:10000] if m else 'NONE')
          # print contexts containing chapter markers / timestamps
          for key in ['chapter','Chapter','shortDescription','description','00:','0:00','1:00']:
              print('\nKEY',key)
              pos=0; n=0
              while True:
                  p=r.text.find(key,pos)
                  if p<0 or n>=10: break
                  print(r.text[max(0,p-600):p+1800])
                  pos=p+len(key); n+=1
          PY
