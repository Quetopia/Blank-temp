name: Quetopia Signal CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate runtime JavaScript
        run: |
          node --check signal016-bundle.js
          node --check signal016-pro.js
          node --check signal016-world.js
          node --check signal016-combat.js
          node --check signal016-systems-v2.js
          node --check signal016-audio.js
          node --check signal016-onboarding.js
          node --check signal016-atmosphere.js
          node --check signal017-arpg.js
          node --check signal017-refinements.js
          node --check signal017-qol.js
      - name: Verify production loader references
        run: |
          grep -q "signal015.html" index.html
          grep -q "signal015-core.html" signal015.html
          grep -q "signal016-bundle.js" signal015.html
          grep -q "signal016-pro.js" signal016-bundle.js
          grep -q "signal016-world.js" signal016-bundle.js
          grep -q "signal016-combat.js" signal016-bundle.js
          grep -q "signal016-systems-v2.js" signal016-bundle.js
          grep -q "signal016-audio.js" signal016-bundle.js
          grep -q "signal016-onboarding.js" signal016-bundle.js
          grep -q "signal016-atmosphere.js" signal016-bundle.js
          grep -q "signal017-arpg.js" signal016-bundle.js
          grep -q "signal017-refinements.js" signal016-bundle.js
          grep -q "signal017-qol.js" signal016-bundle.js

  browser-smoke:
    needs: runtime-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serve Quetopia locally
        run: |
          python3 -m http.server 8080 > /tmp/quetopia-server.log 2>&1 &
          sleep 2
      - name: Boot game in headless Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --use-gl=swiftshader --enable-unsafe-swiftshader --window-size=1440,900 --virtual-time-budget=14000 --dump-dom http://127.0.0.1:8080/index.html > /tmp/quetopia-dom.html 2> /tmp/chrome.log
          grep -q 'id="prohud"' /tmp/quetopia-dom.html
          grep -q 'id="combatReadout"' /tmp/quetopia-dom.html
          grep -q 'id="qMenuShade"' /tmp/quetopia-dom.html
          grep -q 'id="audioState"' /tmp/quetopia-dom.html
          grep -q 'id="zoneReveal"' /tmp/quetopia-dom.html
          grep -q 'id="cinemaVignette"' /tmp/quetopia-dom.html
          grep -q 'id="qGearAdv"' /tmp/quetopia-dom.html
          grep -q 'id="qPassiveAdv"' /tmp/quetopia-dom.html
          grep -q 'id="qSkillsAdv"' /tmp/quetopia-dom.html
          grep -q 'id="qForgeAdv"' /tmp/quetopia-dom.html
          grep -q 'id="qFilterAdv"' /tmp/quetopia-dom.html
          grep -q 'id="qWeaveLegend"' /tmp/quetopia-dom.html
          grep -q 'id="qArmoryWrap"' /tmp/quetopia-dom.html
          grep -q 'id="qResetPassives"' /tmp/quetopia-dom.html
          grep -q 'id="qResetSkills"' /tmp/quetopia-dom.html
          grep -q 'SIGNAL 016' /tmp/quetopia-dom.html
      - name: Show browser diagnostics on failure
        if: failure()
        run: |
          echo '--- DOM tail ---'
          tail -160 /tmp/quetopia-dom.html || true
          echo '--- Chrome log ---'
          tail -200 /tmp/chrome.log || true
          echo '--- Server log ---'
          cat /tmp/quetopia-server.log || true
