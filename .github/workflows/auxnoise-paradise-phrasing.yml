name: AUXNOISE Paradise Phrasing
on:
  push:
    paths:
      - '.github/workflows/auxnoise-paradise-phrasing.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download converted Paradise MP3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10001666584/zip > paradise.zip
          unzip -o paradise.zip
          ls -lh Auxnoise-Paradise.mp3
      - name: Install audio analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q openai-whisper demucs
      - name: Isolate lead vocal
        run: |
          python -m demucs --two-stems=vocals -n htdemucs Auxnoise-Paradise.mp3
          find separated -type f -maxdepth 4 -print
      - name: Analyze isolated vocal phrasing with lyric prompt
        run: |
          python - <<'PY'
          import whisper, json, glob
          vocals=glob.glob('separated/htdemucs/*/vocals.wav')[0]
          prompt='''I took a walk along the coast. I sold the things that mean the most. I can see my ghost. Why did you try shoot me down. Like a bullet in the head. Wrecking ball, knocking all on painted wall. When there's no one left around. Run around just to hear you say. I drink too much. Would it ever change. Memory deranged. Someone says I need peace of mind. But I never even saw the sign. Love is such a crime. Love takes you looking for drugs. Life took me down don't know which way is. Why did you try shoot me down. Like a bullet in the head. Wrecking ball, knocking all on painted wall. When there's no one left around.'''
          model=whisper.load_model('base.en')
          result=model.transcribe(vocals, language='en', fp16=False, temperature=0, word_timestamps=True, initial_prompt=prompt, condition_on_previous_text=False, no_speech_threshold=0.45, logprob_threshold=-1.2, verbose=False)
          compact=[]
          for s in result['segments']:
              compact.append({
                  'start':round(s['start'],2),'end':round(s['end'],2),'text':s['text'].strip(),
                  'words':[{'start':round(w['start'],2),'end':round(w['end'],2),'word':w['word'],'prob':round(w.get('probability',0),3)} for w in s.get('words',[])]
              })
          with open('paradise-vocal-phrasing.json','w') as f: json.dump(compact,f,indent=2)
          with open('paradise-vocal-phrasing.txt','w') as f:
              for s in compact:
                  f.write(f"{s['start']:7.2f} - {s['end']:7.2f}  {s['text']}\n")
          print(open('paradise-vocal-phrasing.txt').read())
          PY
      - name: Upload phrasing analysis
        uses: actions/upload-artifact@v4
        with:
          name: Auxnoise-Paradise-Vocal-Phrasing
          path: |
            paradise-vocal-phrasing.json
            paradise-vocal-phrasing.txt
          if-no-files-found: error
