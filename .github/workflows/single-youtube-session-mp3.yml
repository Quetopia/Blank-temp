name: Single YouTube Session MP3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/single-youtube-session-mp3.yml

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Convert via alternate MP3 API
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl --max-time 300 -sS -X POST 'https://ytmp3.ge/api/convert' \
            -d 'youtube_url=https://youtu.be/oo-XzqolMXM' \
            -d 'quality=320')
          printf '%s' "$RESP" > response.json
          python - <<'PY'
          import json
          d=json.load(open('response.json'))
          print('title:', d.get('title'))
          print('success:', d.get('success'))
          print('sizeMB:', d.get('sizeMB'))
          if not d.get('success'):
              raise SystemExit('conversion failed: '+str(d))
          open('download_url.txt','w').write(d['downloadUrl'])
          title=d.get('title') or 'oo-XzqolMXM'
          safe=''.join(c if c.isalnum() or c in ' ._-' else '_' for c in title).strip()[:100]
          open('title.txt','w').write(safe or 'oo-XzqolMXM')
          PY
          URL=$(cat download_url.txt)
          curl --max-time 180 -fL -sS "$URL" -o output.mp3
          file output.mp3
          ls -lh output.mp3
          python - <<'PY'
          from pathlib import Path
          p=Path('output.mp3').read_bytes()[:32]
          if p.lstrip().startswith(b'<') or b'html' in p.lower():
              raise SystemExit('download URL returned HTML, not audio')
          if Path('output.mp3').stat().st_size < 100000:
              raise SystemExit('audio file suspiciously small')
          PY
      - name: Upload MP3
        uses: actions/upload-artifact@v4
        with:
          name: oo-XzqolMXM-MP3
          path: output.mp3
          if-no-files-found: error
          retention-days: 7
