name: Single YouTube Session MP3
on:
  push:
    paths:
      - '.github/workflows/single-youtube-session-mp3.yml'
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert Broken Flowers via mp3youtube API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, json
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36'
          headers_key={
            'User-Agent':UA,
            'Content-Type':'application/json',
            'Origin':'https://iframe.y2meta-uk.com',
            'Accept':'*/*'
          }
          r=requests.get('https://api.mp3youtube.cc/v2/sanity/key',headers=headers_key,timeout=30)
          print('key status',r.status_code)
          r.raise_for_status()
          key=r.json()['key']
          payload={'link':'https://youtu.be/oo-XzqolMXM','format':'mp3','audioBitrate':'320','videoQuality':'720','vCodec':'h264'}
          headers_conv={
            'User-Agent':UA,
            'Content-Type':'application/json',
            'Origin':'https://iframe.y2meta-uk.com',
            'Accept':'*/*',
            'key':key
          }
          r=requests.post('https://api.mp3youtube.cc/v2/converter',json=payload,headers=headers_conv,timeout=60)
          print('convert status',r.status_code)
          print('convert body',r.text[:1200])
          r.raise_for_status()
          data=r.json()
          url=data.get('url')
          if not url or not url.startswith('http'):
            raise SystemExit('No download URL')
          rr=requests.get(url,headers={'User-Agent':UA,'Referer':'https://iframe.y2meta-uk.com/'},allow_redirects=True,timeout=180)
          print('download status',rr.status_code,'type',rr.headers.get('content-type'),'size',len(rr.content),'final',rr.url)
          rr.raise_for_status()
          if len(rr.content)<100000 or rr.content.lstrip().startswith(b'<'):
            raise SystemExit('Not real audio')
          open('Broken-Flowers.mp3','wb').write(rr.content)
          PY
          file Broken-Flowers.mp3
          ls -lh Broken-Flowers.mp3
      - name: Upload MP3
        uses: actions/upload-artifact@v4
        with:
          name: Broken-Flowers-MP3
          path: Broken-Flowers.mp3
          if-no-files-found: error
