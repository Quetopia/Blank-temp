name: Single YouTube Session MP3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/single-youtube-session-mp3.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect generated download page
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl --max-time 300 -sS -X POST 'https://ytmp3.ge/api/convert' \
            -d 'youtube_url=https://youtu.be/oo-XzqolMXM' \
            -d 'quality=320')
          printf '%s' "$RESP" > response.json
          python - <<'PY'
          import json
          d=json.load(open('response.json'))
          print('API', d)
          if not d.get('success'):
              raise SystemExit(1)
          open('download_url.txt','w').write(d['downloadUrl'])
          PY
          URL=$(cat download_url.txt)
          echo "DOWNLOAD_PAGE=$URL"
          curl --max-time 120 -sS -L -A 'Mozilla/5.0' -D headers.txt "$URL" -o page.html
          echo '--- HEADERS ---'
          cat headers.txt
          echo '--- FILE ---'
          file page.html
          echo '--- URL CANDIDATES ---'
          python - <<'PY'
          import re, html
          s=open('page.html',errors='ignore').read()
          for pat in [r'https?://[^"\'<> ]+', r'(?:href|src)=["\']([^"\']+)', r'url\s*[:=]\s*["\']([^"\']+)']:
              vals=re.findall(pat,s,re.I)
              for v in vals[:200]:
                  print(html.unescape(v))
          print('--- MP3 CONTEXT ---')
          for m in re.finditer('mp3|download|audio|media',s,re.I):
              a=max(0,m.start()-180); b=min(len(s),m.end()+300)
              print(s[a:b].replace('\n',' ')[:600])
          PY
