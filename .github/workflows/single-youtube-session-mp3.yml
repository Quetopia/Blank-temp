name: Single YouTube Session MP3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/single-youtube-session-mp3.yml

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch audio through Piped and convert to MP3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          VIDEO='oo-XzqolMXM'
          rm -f streams.json audio_url.txt input_audio Broken-Flowers.mp3

          SUCCESS=0
          for BASE in 'https://pipedapi.wireway.ch' 'https://api.piped.private.coffee'; do
            echo "Trying $BASE"
            if curl --max-time 45 -fsSL "$BASE/streams/$VIDEO" -o streams.json; then
              if python - <<'PY'
          import json, sys
          d=json.load(open('streams.json'))
          streams=d.get('audioStreams') or []
          streams=[s for s in streams if s.get('url')]
          if not streams:
              raise SystemExit(1)
          streams.sort(key=lambda s: int(s.get('bitrate') or 0), reverse=True)
          s=streams[0]
          print('title:', d.get('title'))
          print('selected bitrate:', s.get('bitrate'))
          print('mime:', s.get('mimeType'))
          open('audio_url.txt','w').write(s['url'])
          PY
              then
                AUDIO_URL=$(cat audio_url.txt)
                if curl --max-time 180 -fL --retry 2 -A 'Mozilla/5.0' "$AUDIO_URL" -o input_audio; then
                  if [ $(stat -c%s input_audio) -gt 100000 ]; then
                    SUCCESS=1
                    break
                  fi
                fi
              fi
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo 'Piped instances failed'
            exit 1
          fi

          file input_audio
          ls -lh input_audio
          ffmpeg -hide_banner -loglevel error -y -i input_audio -vn -codec:a libmp3lame -b:a 192k 'Broken-Flowers.mp3'
          file 'Broken-Flowers.mp3'
          ls -lh 'Broken-Flowers.mp3'
          python - <<'PY'
          from pathlib import Path
          p=Path('Broken-Flowers.mp3')
          if p.stat().st_size < 100000:
              raise SystemExit('MP3 too small')
          b=p.read_bytes()[:16]
          if b.lstrip().startswith(b'<') or b'html' in b.lower():
              raise SystemExit('not audio')
          PY

      - name: Upload MP3
        uses: actions/upload-artifact@v4
        with:
          name: Broken-Flowers-MP3
          path: Broken-Flowers.mp3
          if-no-files-found: error
          retention-days: 7
